<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Listing | CognoRise Internship</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn {
            background: #eff6ff;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            transition: background 0.2s;
        }

        .cart-btn:hover {
            background: #dbeafe;
        }

        .badge {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px 20px;
        }

        .controls-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 45px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            font-size: 0.95rem;
            background: var(--card-bg);
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img-container {
            height: 180px;
            overflow: hidden;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .product-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-name {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .btn-add-cart {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-add-cart:hover {
            background: var(--primary-dark);
        }

        /* Cart Modal Drawer */
        .cart-modal {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            justify-content: flex-end;
            transition: opacity 0.3s;
        }

        .cart-content {
            background: white;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.1);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .qty-btn {
            background: #e2e8f0;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: #cbd5e1;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            background: #f8fafc;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 600;
        }

        .btn-checkout {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-checkout:hover {
            background: #059669;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 0;
            background: white;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container navbar">
            <div class="logo">
                <i class="fa-solid fa-shop"></i> <span>ShopEase</span>
            </div>
            <div class="cart-btn" id="cartToggleBtn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Cart</span>
                <span id="cartBadge" class="badge">0</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container main-content">
        <!-- Controls: Search & Filter -->
        <section class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search products by name...">
            </div>
            <div class="filter-buttons" id="categoryFilters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="Electronics">Electronics</button>
                <button class="filter-btn" data-category="Fashion">Fashion</button>
                <button class="filter-btn" data-category="Home">Home & Living</button>
            </div>
        </section>

        <!-- Product Grid Section -->
        <section class="product-section">
            <div id="productGrid" class="product-grid">
                <!-- Products loaded dynamically via JS -->
            </div>
            <div id="noResults" class="no-results hidden">
                <i class="fa-solid fa-box-open"></i>
                <p>No products found matching your search.</p>
            </div>
        </section>
    </main>

    <!-- Cart Drawer / Modal -->
    <div id="cartModal" class="cart-modal hidden">
        <div class="cart-content">
            <div class="cart-header">
                <h2><i class="fa-solid fa-bag-shopping"></i> Your Shopping Cart</h2>
                <button id="closeCartBtn" class="close-btn">&times;</button>
            </div>
            <div id="cartItemsContainer" class="cart-items">
                <!-- Cart items rendered here -->
            </div>
            <div class="cart-footer">
                <div class="cart-summary-row">
                    <span>Total Items:</span>
                    <span id="cartTotalItems">0</span>
                </div>
                <div class="cart-summary-row">
                    <span>Total Price:</span>
                    <span id="cartTotalPrice">$0.00</span>
                </div>
                <button id="checkoutBtn" class="btn btn-checkout">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 E-Commerce Store | Built for CognoRise Infotech Internship</p>
    </footer>

    <script>
        // Mock Product Data
        const products = [
            { id: 1, name: "Wireless Bluetooth Headphones", price: 79.99, category: "Electronics", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Smart Fitness Watch", price: 129.99, category: "Electronics", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Casual Cotton T-Shirt", price: 24.99, category: "Fashion", image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "Classic Denim Jacket", price: 65.00, category: "Fashion", image: "https://images.unsplash.com/photo-1543076447-215ad9ba6923?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "Minimalist Desk Lamp", price: 34.50, category: "Home", image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=500&q=80" },
            { id: 6, name: "Ceramic Coffee Mug Set", price: 19.99, category: "Home", image: "https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=500&q=80" },
            { id: 7, name: "Portable Bluetooth Speaker", price: 45.00, category: "Electronics", image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=500&q=80" },
            { id: 8, name: "Running Sports Shoes", price: 89.99, category: "Fashion", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80" }
        ];

        // Load Cart from LocalStorage
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // DOM Elements
        const productGrid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryFilters = document.getElementById('categoryFilters');
        const noResults = document.getElementById('noResults');
        const cartToggleBtn = document.getElementById('cartToggleBtn');
        const cartModal = document.getElementById('cartModal');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartBadge = document.getElementById('cartBadge');
        const cartTotalItems = document.getElementById('cartTotalItems');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        const checkoutBtn = document.getElementById('checkoutBtn');

        // Initial Render
        renderProducts(products);
        updateCartUI();

        // Event Listeners
        searchInput.addEventListener('input', filterProducts);
        categoryFilters.addEventListener('click', handleCategoryFilter);
        cartToggleBtn.addEventListener('click', () => cartModal.classList.remove('hidden'));
        closeCartBtn.addEventListener('click', () => cartModal.classList.add('hidden'));
        checkoutBtn.addEventListener('click', handleCheckout);

        // Function: Render Products Grid
        function renderProducts(productsToRender) {
            productGrid.innerHTML = '';

            if (productsToRender.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.classList.add('product-card');
                card.innerHTML = `
                    <div class="product-img-container">
                        <img src="${product.image}" alt="${product.name}" class="product-img">
                    </div>
                    <div class="product-info">
                        <div>
                            <span class="product-category">${product.category}</span>
                            <h3 class="product-name">${product.name}</h3>
                            <p class="product-price">$${product.price.toFixed(2)}</p>
                        </div>
                        <button class="btn-add-cart" onclick="addToCart(${product.id})">
                            <i class="fa-solid fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Function: Filter by Search & Category
        function filterProducts() {
            const query = searchInput.value.toLowerCase().trim();
            const activeCategoryBtn = categoryFilters.querySelector('.filter-btn.active');
            const selectedCategory = activeCategoryBtn ? activeCategoryBtn.dataset.category : 'all';

            const filtered = products.filter(product => {
                const matchesName = product.name.toLowerCase().includes(query);
                const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
                return matchesName && matchesCategory;
            });

            renderProducts(filtered);
        }

        // Function: Category Button Click Handling
        function handleCategoryFilter(e) {
            if (!e.target.classList.contains('filter-btn')) return;

            categoryFilters.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');

            filterProducts();
        }

        // Function: Add to Cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveAndRefreshCart();
        }

        // Function: Update Item Quantity
        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                removeFromCart(productId);
            } else {
                saveAndRefreshCart();
            }
        }

        // Function: Remove Item from Cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveAndRefreshCart();
        }

        // Function: Save to LocalStorage & Refresh UI
        function saveAndRefreshCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        // Function: Update Cart UI
        function updateCartUI() {
            const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartBadge.textContent = totalItemsCount;
            cartTotalItems.textContent = totalItemsCount;

            const totalPriceVal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotalPrice.textContent = `$${totalPriceVal.toFixed(2)}`;

            cartItemsContainer.innerHTML = '';

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="text-align: center; color: #64748b; margin-top: 40px;">Your cart is empty.</p>`;
                return;
            }

            cart.forEach(item => {
                const cartItemEl = document.createElement('div');
                cartItemEl.classList.add('cart-item');
                cartItemEl.innerHTML = `
                    <div class="cart-item-details">
                        <h4>${item.name}</h4>
                        <p class="cart-item-price">$${item.price.toFixed(2)} x ${item.quantity}</p>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart(${item.id})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                cartItemsContainer.appendChild(cartItemEl);
            });
        }

        // Function: Checkout
        function handleCheckout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            alert('Order placed successfully! Thank you for shopping with us.');
            cart = [];
            saveAndRefreshCart();
            cartModal.classList.add('hidden');
        }
    </script>
</body>
</html>
